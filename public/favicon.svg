<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E1E26" />
      <stop offset="70%" stop-color="#141419" />
      <stop offset="100%" stop-color="#0D0D10" />
    </radialGradient>

    <!-- Crimson Rose Gradient Outer -->
    <linearGradient id="roseGradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="35%" stop-color="#F43F5E" />
      <stop offset="75%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>

    <!-- Deep Crimson Inner Petal Gradient -->
    <linearGradient id="roseGradDeep" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="50%" stop-color="#BE123C" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Leaf Green Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Gold Accent Sparkle Gradient -->
    <linearGradient id="goldSparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="roseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Outer Ring Glow -->
    <filter id="ringGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Outer Background Container -->
  <circle cx="256" cy="256" r="246" fill="url(#bgGrad)" stroke="#E11D48" stroke-width="4" stroke-opacity="0.35" />
  
  <!-- Inner Delicate Luxury Ring -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.12" stroke-dasharray="6 4" />

  <!-- Botanical Leaf on Right Bottom -->
  <path d="M 285 320 C 350 335 395 295 405 235 C 345 230 300 270 285 320 Z" 
        fill="url(#leafGrad)" opacity="0.9" />
  <path d="M 290 315 C 335 285 375 255 405 235" 
        stroke="#A7F3D0" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Small Secondary Leaf on Left -->
  <path d="M 215 330 C 160 350 120 315 110 265 C 165 255 205 290 215 330 Z" 
        fill="url(#leafGrad)" opacity="0.75" />

  <!-- Central Flower Shadow/Aura -->
  <circle cx="256" cy="245" r="115" fill="#E11D48" opacity="0.15" filter="url(#roseGlow)" />

  <!-- Layer 1: Outer Petals (Deep Velvet) -->
  <path d="M 256 120 C 330 115 375 175 365 245 C 355 315 300 355 256 365 C 212 355 157 315 147 245 C 137 175 182 115 256 120 Z" 
        fill="url(#roseGradDeep)" />

  <!-- Layer 2: Main Outer Flared Petals -->
  <!-- Left Flared Petal -->
  <path d="M 256 135 C 180 145 155 210 165 270 C 185 330 245 348 256 350 C 220 320 200 270 205 220 C 210 170 240 145 256 135 Z" 
        fill="url(#roseGradMain)" opacity="0.95" />

  <!-- Right Flared Petal -->
  <path d="M 256 135 C 332 145 357 210 347 270 C 327 330 267 348 256 350 C 292 320 312 270 307 220 C 302 170 272 145 256 135 Z" 
        fill="url(#roseGradMain)" opacity="0.95" />

  <!-- Layer 3: Mid Blooming Petals (Interlocking Rose Curve) -->
  <!-- Left Inner Curve -->
  <path d="M 256 160 C 210 170 195 220 210 265 C 225 305 256 325 256 325 C 240 295 230 255 240 215 C 245 185 255 170 256 160 Z" 
        fill="#BE123C" />

  <!-- Right Inner Curve -->
  <path d="M 256 165 C 298 175 312 220 300 265 C 285 305 256 325 256 325 C 270 295 278 255 270 215 C 265 185 258 172 256 165 Z" 
        fill="url(#roseGradMain)" />

  <!-- Layer 4: Tight Rose Core / Spiral Heart -->
  <path d="M 256 185 C 240 185 230 198 232 215 C 235 235 250 245 256 248 C 262 245 277 235 280 215 C 282 198 272 185 256 185 Z" 
        fill="#FDA4AF" opacity="0.9" />

  <path d="M 248 198 C 248 192 256 188 262 192 C 268 196 266 208 258 212 C 252 215 248 208 248 198 Z" 
        fill="#FFFFFF" opacity="0.85" />

  <!-- Top Center Petal Crest Accent -->
  <path d="M 256 115 C 260 128 268 138 274 142 C 265 142 256 138 256 115 Z" fill="#FECDD3" />
  <path d="M 256 115 C 252 128 244 138 238 142 C 247 142 256 138 256 115 Z" fill="#FDA4AF" />

  <!-- Sparkle Accent Stars (Luxury Atelier Aesthetic) -->
  <!-- Top Right Sparkle -->
  <g transform="translate(370, 130) scale(0.85)" filter="url(#ringGlow)">
    <path d="M 0,-18 Q 0,0 18,0 Q 0,0 0,18 Q 0,0 -18,0 Q 0,0 0,-18 Z" fill="#FFFFFF" opacity="0.95" />
    <circle cx="0" cy="0" r="3" fill="#FECDD3" />
  </g>

  <!-- Small Left Sparkle -->
  <g transform="translate(135, 175) scale(0.55)">
    <path d="M 0,-18 Q 0,0 18,0 Q 0,0 0,18 Q 0,0 -18,0 Q 0,0 0,-18 Z" fill="#F43F5E" opacity="0.9" />
  </g>

  <!-- Small Bottom Center Sparkle -->
  <g transform="translate(256, 395) scale(0.5)">
    <path d="M 0,-18 Q 0,0 18,0 Q 0,0 0,18 Q 0,0 -18,0 Q 0,0 0,-18 Z" fill="#FFFFFF" opacity="0.8" />
  </g>

</svg>
